services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Bound to localhost by default: only this machine can reach the API.
    # To expose it on your network/internet, bind wider here AND set API_KEY
    # below explicitly (otherwise a fresh key is generated per container).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      # AI assistant (optional). Either an Anthropic key, or a bearer token plus
      # the base URL of any server that speaks the Anthropic Messages API
      # (llama.cpp llama-server, llama-swap, LiteLLM, ...). AI_MODEL must be a
      # model that endpoint serves. See README "Optional: AI assistant".
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-}
      - AI_THINKING=${AI_THINKING:-}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0 # safe: still only published to 127.0.0.1 above
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - DATA_DIR=/app/data
      # Leave unset unless you put your own trusted reverse proxy in front of
      # the web service (see README > Security defaults) — otherwise a caller
      # could forge X-Forwarded-For to dodge the /api/ai rate limit.
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      - terminal-data:/app/data
    # Lets ANTHROPIC_BASE_URL=http://host.docker.internal:<port> reach a model
    # server running on the Docker host itself (Linux needs this line; Docker
    # Desktop provides the name on its own).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_URL=http://api:4000
      - API_KEY=${API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
    volumes:
      - terminal-data:/app/data:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  terminal-data:
